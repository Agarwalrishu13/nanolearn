name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The built-in engine must work on a bare interpreter: no pip step here.
      - name: Run the test suite (built-in engine only)
        run: python -m unittest discover tests -v

      - name: Show what this machine can do
        run: python -m nanolearn doctor

      - name: Install the optional full engine
        run: python -m pip install scikit-learn

      - name: Run the tests again, now with scikit-learn
        run: python -m unittest discover tests -v
